apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: configforges.lab.example.com
spec:
  group: lab.example.com
  names:
    plural: configforges
    singular: configforge
    kind: ConfigForge
    shortNames:
      - cfgforge
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: ConfigForge custom resource with OpenAPI v3 schema validation on spec.data.
          required:
            - spec
          properties:
            spec:
              type: object
              description: Desired configuration payload validated by the API server.
              required:
                - data
              properties:
                data:
                  type: string
                  minLength: 1
                  maxLength: 40
                  description: Required configuration string (1 to 40 characters; longer values are rejected).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: cka-lab20
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: cka-lab20
  labels:
    app: web
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 80
---
